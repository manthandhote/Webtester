<!doctype html>
<html><head><meta charset="utf-8"><title>Results</title></head>
<body>
  <div id="dashboard">
    <p id="welcome">Welcome, <b>Alice</b>!<span style="display:none"> (hidden)</span></p>
    <table id="results-table">
      <thead><tr><th>AWB</th><th>Status</th></tr></thead>
      <tbody>
        <tr><td>1234567890</td><td>Delivered</td></tr>
        <tr><td>9876543210</td><td>In Transit</td></tr>
      </tbody>
    </table>
    <button id="download-report" data-testid="download-report" onclick="downloadFile('/shipments-report.csv')">Download report</button>
  </div>
  <script>
    function downloadFile(url) {
      var a = document.createElement('a');
      a.href = url;
      a.download = url.split('/').pop();
      document.body.appendChild(a);
      a.click();
      a.remove();
    }
  </script>
</body></html>
